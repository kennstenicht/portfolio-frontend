name: ✅ Checks

# Reusable workflow: lint + test. Called by pull-request.yml and deploy.yml.
on:
  workflow_call: {}

jobs:
  lint:
    name: "🧹 Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6
      - name: 🛠️ Set up pnpm
        uses: pnpm/action-setup@v6
      - name: 🛠️  Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: ⬇️ Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🧹 Lint
        run: pnpm lint

  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6
      - name: 🛠️  Set up pnpm
        uses: pnpm/action-setup@v6
      - name: 🛠️  Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: ⬇️ Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🧪 Run tests
        run: pnpm test
